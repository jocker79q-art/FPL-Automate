name: Train ML projection model

# Fetches historical data, trains the ML model, walk-forward backtests it
# against the hand-coded baseline and FPL's own xP, and commits the trained
# models + backtest report -- separate from weekly-plan.yml (which runs
# twice daily and just *uses* whatever's already committed here) so a
# retrain doesn't happen on every single weekly-plan run. See
# docs/ROADMAP.md "Phase 2" and src/fpl_automate/projections/ml/backtest.py.

on:
  workflow_dispatch: {}  # retrain on demand from the Actions tab
  schedule:
    # Weekly is plenty -- historical seasons only change once a completed
    # season's data settles, and the in-progress season's rolling form
    # features are recomputed live at inference time anyway (ml/live.py),
    # not baked into this commit.
    - cron: "0 6 * * 1"  # 06:00 UTC every Monday

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch historical data, train, and backtest
        run: fpl-automate backtest

      - name: Commit updated models + backtest report
        # Retries with a rebase on a non-fast-forward push: this can race
        # weekly-plan.yml pushing to the same branch (either can also be
        # run manually at any time) -- not a real conflict, since the two
        # workflows touch disjoint files, just a rejected non-fast-forward
        # push, so rebasing onto whatever it just pushed and retrying is safe.
        run: |
          git config user.name "fpl-automate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add models/ reports/model_backtest.md reports/model_backtest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Retrain ML projection model [skip ci]"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/4) -- rebasing onto the current remote branch and retrying."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after 4 attempts."
          exit 1
