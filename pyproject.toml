[project]
name = "fpl-automate"
version = "0.1.0"
description = "Quantitative decision-support platform for Fantasy Premier League management (and, later, structured funding/bursary decisions). Recommendation-only by default; never executes actions without explicit approval."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PuLP>=2.8",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
fpl-automate = "fpl_automate.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
packages = ["fpl_automate"]
mypy_path = "src"
ignore_missing_imports = true
